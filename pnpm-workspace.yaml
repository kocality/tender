packages:
  - packages/*
  - cli
  - app
  - relayer

# pnpm 12 fails install (ERR_PNPM_IGNORED_BUILDS) on unreviewed build scripts.
# All are denied: each has a prebuilt binary or a pure-JS fallback, so no native
# compiler is needed on a judge's machine. Reviewed 2026-11-10.
allowBuilds:
  bigint-buffer: false
  bufferutil: false
  core-js-pure: false
  esbuild: false
  protobufjs: false
  secp256k1: false
  utf-8-validate: false

# A Node older than engines.node in package.json fails the install with ERR_PNPM_UNSUPPORTED_ENGINE
# (Node 18 otherwise gets as far as "crypto.getRandomValues must be defined").
engineStrict: true

# Never link agent skills shipped inside dependencies into this repo.
skills:
  dirs: []

# Every workspace vitest peer resolves the same patched vite (GHSA-p4f5-76q4-ffq7, fixed in 8.3.7).
overrides:
  vite: 8.3.7
