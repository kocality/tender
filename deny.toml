# cargo-deny config for the advisories check in .github/workflows/ci.yml.
# Scope: the dependencies compiled into contract/res/tender.wasm (wasm32 target, no dev dependencies).
# Host-only test tooling (near-workspaces, near-vm-runner) is out of scope on purpose.
[graph]
targets = ["wasm32-unknown-unknown"]
exclude-dev = true

[advisories]
ignore = [
  # near-sdk 5.30.1 pulls wee_alloc in by default. Informational (unmaintained) notice, no safe upgrade exists.
  { id = "RUSTSEC-2022-0054", reason = "near-sdk default allocator; unmaintained notice only, no fix available" },
]
