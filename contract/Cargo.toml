[package]
name = "tender"
description = "Sealed-bid token sales opened by NEAR's MPC network (CKD)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
# NEP-330: cargo-near embeds this link in contract_source_metadata. Set the real public repo
# URL before the reproducible build that gets deployed to v1.tenderseal.near.
repository = "https://github.com/yigitcangokmen/tender"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build (NEP-330). Image tag and digest checked on Docker Hub 2026-11-09.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = "=0.24.0"
tokio = { version = "=1.54.1", features = ["full"] }
serde_json = "=1.0.154"
proptest = "=1.12.0"
anyhow = "=1.0.104"
# raw_ed25519 Intents signatures in the sandbox tests only (near-workspaces keeps its signing API
# crate-private). Never in the wasm.
ed25519-dalek = "=2.2.0"
# Gate S3 alternative only (near-kit based, not near-workspaces). Uncomment if initialising
# the intents.near 0.4.5 wasm by hand in near-workspaces is too slow.
# defuse-sandbox = { git = "https://github.com/near/intents", rev = "16d04f6ec4401263f8914638710260da50bb46b0", features = ["defuse"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
