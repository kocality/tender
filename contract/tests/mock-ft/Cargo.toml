[package]
name = "mock-ft"
description = "NEP-141 test token for the sandbox tests (stands in for USDC and wNEAR). Never deployed to mainnet."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

# Standalone crate: keeps the tender package's Cargo.lock and reproducible build untouched.
[workspace]
